name: Daily Basis Update

on:
  schedule:
    # GitHub 的 schedule 不保证准时, 常见延迟数小时甚至丢单.
    # 所以在收盘前也放几组“缓冲”定时: 正常会因未收盘被跳过,
    # 一旦被延迟到 15:00 之后, 就正好补上一次真实更新.
    - cron: '0 1 * * 1-5'    # 北京 09:00, 缓冲
    - cron: '30 2 * * 1-5'   # 北京 10:30, 缓冲
    - cron: '0 4 * * 1-5'    # 北京 12:00, 缓冲
    - cron: '30 5 * * 1-5'   # 北京 13:30, 缓冲
    - cron: '5 7 * * 1-5'    # 北京 15:05, 收盘后主定时
    - cron: '20 7 * * 1-5'   # 北京 15:20, 兜底
    - cron: '0 8 * * 1-5'    # 北京 16:00, 兜底
    - cron: '45 9 * * 1-5'   # 北京 17:45, 兜底
    - cron: '30 11 * * 1-5'  # 北京 19:30, 兜底
    - cron: '30 13 * * 1-5'  # 北京 21:30, 兜底
    - cron: '30 15 * * 1-5'  # 北京 23:30, 兜底
    - cron: '0 0 1 * *'      # 每月 1 日保活, 防止 60 天无活动禁用定时任务
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'pipeline.py'
      - '.github/workflows/daily_update.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: basis-update
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PYTHONIOENCODING: utf-8

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit_push.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Print current time (debug)
        run: |
          echo "UTC time: $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Beijing time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "Triggered by: ${{ github.event_name }}"

      - name: Check freshness and time
        id: freshness
        run: |
          TODAY=$(date +%F)
          HOUR=$(date +%-H)
          # 15:xx 先出一版收盘价数据; 17:30 之后的那次更新才算定稿。
          # 定稿前允许后续定时覆盖, 这样 18 点左右还会再刷新一次。
          UPD=$(sed -n 's/.*"update_time":"\([^"]*\)".*/\1/p' data/index.json | head -n1)
          UPD_DATE=${UPD%% *}
          UPD_HM=${UPD#* }
          FINAL=no
          if [ "$UPD_DATE" = "$TODAY" ] \
             && [[ "${UPD_HM:-00:00}" > "17:30" || "${UPD_HM:-00:00}" = "17:30" ]] \
             && grep -q "\"latest_trade_date\":\"$TODAY" data/index.json; then
            FINAL=yes
          fi
          if [ "$FINAL" = "yes" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "data finalized for $TODAY at $UPD_HM, scheduled run will skip"
          elif [ "$HOUR" -lt 15 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Beijing time ${HOUR}:xx is before 15:00, scheduled run will skip"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline
        if: github.event_name != 'schedule' || steps.freshness.outputs.skip != 'true'
        run: python pipeline.py

      - name: Validate JSON
        run: |
          if grep -rn '<<<<<<<\|>>>>>>>' data/; then
            echo "ERROR: conflict markers found in data/"
            exit 1
          fi
          python - <<'PY'
          import json, glob
          files = sorted(glob.glob("data/*.json"))
          for f in files:
              with open(f, encoding="utf-8") as fh:
                  json.load(fh)
          idx = json.load(open("data/index.json", encoding="utf-8"))
          if idx["total"] < 30:
              raise SystemExit("品种数异常: %s" % idx["total"])
          print("%d files ok, %d varieties" % (len(files), idx["total"]))
          PY

      - name: Commit and push
        id: commit_push
        run: |
          git config user.name "Basis Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no-data-change=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git commit -m "chore: daily basis update $(date '+%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi

      - name: Keepalive - touch file (monthly)
        if: github.event_name == 'schedule' && github.event.schedule == '0 0 1 * *'
        run: |
          echo "Keepalive run: $(date -u '+%Y-%m-%d %H:%M:%S')" > .github/keepalive
          git config user.name "Basis Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git diff --staged --quiet || git commit -m "chore: keepalive $(date '+%Y-%m-%d')"
          git pull --rebase origin main
          git push

  # GITHUB_TOKEN 推的 commit 不会触发 pages.yml, 所以这里直接部署一次
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validate data
        run: |
          if grep -rn '<<<<<<<\|>>>>>>>' data/; then
            echo "ERROR: conflict markers found in data/"
            exit 1
          fi
          python -c "import json,glob; [json.load(open(f,encoding='utf-8')) for f in glob.glob('data/*.json')]; print('json ok')"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
